<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول القائد</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#4d446b;font-family:sans-serif}
.card{background:#ffffff;border-radius:16px;padding:28px 22px;width:320px;text-align:center}
img{width:110px;height:110px;border-radius:50%}
h1{font-size:20px;color:#4d446b;margin:12px 0 4px}
p.sub{color:#666666;font-size:14px;margin:0 0 18px}
input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #dddddd;border-radius:8px;font-size:16px}
button{width:100%;padding:12px;border:0;border-radius:8px;background:#e6b227;color:#251f21;font-size:16px;font-weight:bold;cursor:pointer}
.msg{margin-top:12px;font-size:14px;min-height:20px}
.err{color:#c00000}.ok{color:#1a7f4b}
#panel{display:none}
</style>
</head>
<body>
<div class="card">
<img src="IMG-20261127-WA0036.jpg" alt="لوجو المدرسة">
<h1>منطقة القائد</h1>
<p class="sub">مدارس منارة الفاروق عمر الخاصة</p>
<div id="form">
<input id="email" type="email" placeholder="الإيميل" dir="ltr">
<input id="pass" type="password" placeholder="كلمة السر">
<button onclick="login()">دخول</button>
</div>
<div id="panel">
<p class="ok">أهلاً يا قائد</p>
<p id="who"></p>
<button onclick="logout()">خروج</button>
</div>
<p class="msg err" id="msg"></p>
</div>
<script>
const supa = supabase.createClient("https://dekyeekdugyzzgdunsjc.supabase.co", "sb_publishable_y41eQ-FcTonQTWDyBVbWSQ_vtgNbf1j");
async function login(){
  msg.textContent = "";
  const { data, error } = await supa.auth.signInWithPassword({ email: email.value, password: pass.value });
  if (error) { msg.textContent = "الإيميل أو كلمة السر غلط"; return; }
  show(data.user);
}
function show(u){
  form.style.display = "none";
  panel.style.display = "block";
  who.textContent = u.email;
}
async function logout(){
  await supa.auth.signOut();
  panel.style.display = "none";
  form.style.display = "block";
}
supa.auth.getSession().then(({ data }) => { if (data.session) show(data.session.user); });
</script>
</body>
</html>
