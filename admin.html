<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منطقة القائد</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:sans-serif;min-height:100vh;color:#fff;background:#241f33;background-image:radial-gradient(circle at 85% 8%,rgba(230,178,39,.18),transparent 42%),radial-gradient(circle at 8% 35%,rgba(255,45,74,.15),transparent 45%),linear-gradient(165deg,#241f33,#3b3352 55%,#241f33);background-attachment:fixed}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:rgba(36,31,51,.96);border-bottom:1px solid rgba(230,178,39,.35);padding:10px 14px;backdrop-filter:blur(8px)}
.topbar img{width:38px;height:38px;border-radius:50%;border:2px solid #e6b227}
.topbar h1{font-size:17px;margin:0;color:#e6b227;flex:1}
.outbtn{width:auto;padding:7px 14px;background:#4d446b;border:1px solid rgba(230,178,39,.4);color:#fff;border-radius:20px;font-size:13px}
.wrap{max-width:480px;margin:0 auto;padding:12px}
.card{background:rgba(50,43,71,.92);border:1px solid rgba(230,178,39,.35);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.login{text-align:center;padding:24px 18px}
.login img{width:84px;height:84px;border-radius:50%;border:3px solid #e6b227;box-shadow:0 0 22px rgba(230,178,39,.45)}
.login h2{font-size:19px;color:#e6b227;margin:8px 0 10px}
input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:4px 0;border:1px solid rgba(255,255,255,.2);border-radius:10px;font-size:16px;background:rgba(0,0,0,.3);color:#fff}
select option{color:#000}
button{width:100%;padding:11px;border:0;border-radius:10px;background:linear-gradient(90deg,#ff2d4a,#e6b227);color:#fff;font-size:16px;font-weight:700}
#msg{min-height:18px;font-size:14px;margin-top:6px;text-align:center}
.err{color:#ff7a8c}.ok{color:#7be3a8}
.sectT{font-size:15px;color:#e6b227;font-weight:700;margin:18px 0 8px;border-right:4px solid #e6b227;padding-right:10px}
.qrow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(230,178,39,.2);border-radius:14px;padding:10px 12px;margin:8px 0;cursor:pointer}
.qrow .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#574e7c,#4d446b);border:2px solid #e6b227;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#e6b227;flex-shrink:0}
.qrow .qm{flex:1;min-width:0}
.qrow .qn{font-size:14px;font-weight:700;color:#fff}
.qrow .qp{font-size:12px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .qt{font-size:11px;color:rgba(255,255,255,.45)}
.dot{width:10px;height:10px;border-radius:50%;background:#ff2d4a;box-shadow:0 0 10px rgba(255,45,74,.7);flex-shrink:0}
.done{width:16px;height:16px;color:#7be3a8;font-size:13px;flex-shrink:0}
.thread{display:none;padding:6px 4px 10px}
.thread.open{display:block}
.tbub{max-width:92%;padding:8px 11px;margin:8px 0;border-radius:12px;font-size:14px;line-height:1.7}
.tbub p{margin:0;white-space:pre-wrap}
.tbub small{display:block;margin-top:4px;font-size:11px;color:rgba(255,255,255,.5)}
.tin{background:#322b47;border:1px solid rgba(230,178,39,.25);border-bottom-right-radius:4px}
.tout{margin-right:auto;background:linear-gradient(135deg,#574e7c,#4d446b);border:1px solid rgba(230,178,39,.45);border-bottom-left-radius:4px}
.tout b{color:#e6b227}
.prow{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:9px 12px;margin:8px 0;font-size:14px}
.prow b{flex:1}
.tag{display:inline-block;font-size:11px;background:rgba(230,178,39,.2);color:#e6b227;border-radius:20px;padding:1px 8px}
.del{width:auto;padding:4px 12px;background:#ff2d4a;color:#fff;font-size:13px;font-weight:400;border-radius:8px}
.rep{width:auto;padding:8px 14px;background:#e6b227;color:#241f33;font-size:14px;font-weight:700}
.composerow{display:flex;gap:8px;align-items:flex-end}
.composerow textarea{flex:1;margin:0}
.attachbtn{width:46px;height:46px;border-radius:50%;background:#4d446b;border:1px solid rgba(230,178,39,.5);font-size:20px;padding:0;flex-shrink:0}
.filechip{display:none;align-items:center;gap:8px;background:rgba(230,178,39,.12);border:1px solid rgba(230,178,39,.4);border-radius:20px;padding:6px 12px;font-size:13px;margin-top:8px;color:#e6b227}
.filechip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filechip button{width:auto;background:none;border:0;color:#ff7a8c;font-size:16px;padding:0 4px}
.sheetbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.sheet{position:fixed;bottom:0;right:0;left:0;background:#241f33;border-top:1px solid rgba(230,178,39,.4);border-radius:20px 20px 0 0;padding:14px;max-width:480px;margin:0 auto;z-index:21}
.sheetopt{display:flex;align-items:center;gap:14px;padding:14px 8px;font-size:16px;color:#fff;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.07)}
.sheetopt:last-child{border-bottom:0}
.sheetopt .ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,#574e7c,#4d446b);border:1px solid rgba(230,178,39,.4)}
.emptys{text-align:center;color:rgba(255,255,255,.45);font-size:13px;padding:14px}
.foot{text-align:center;color:#e6b227;font-size:12px;padding:16px}
</style>
</head>
<body>
<div class="topbar">
<img src="IMG-20261127-WA0036.jpg" alt="لوجو">
<h1>منطقة القائد</h1>
<button class="outbtn" id="logoutbtn" onclick="logout()" style="display:none">خروج</button>
</div>
<div class="wrap">
<div class="card login" id="form">
<img src="IMG-20261127-WA0036.jpg">
<h2>تسجيل الدخول</h2>
<input id="email" type="email" placeholder="الإيميل">
<input id="pass" type="password" placeholder="كلمة السر">
<button onclick="login()">دخول</button>
</div>
<div id="panel" style="display:none">
<div class="card">
<input id="ptitle" placeholder="العنوان (للواجب: اكتب المادة الأول)">
<select id="kind">
<option value="news">🏫 خبر</option>
<option value="alert">📢 تنبيه مهم</option>
<option value="homework">📚 واجب</option>
<option value="gazette">📰 جريدة</option>
<option value="info">ℹ️ معلومات</option>
</select>
<div class="composerow">
<textarea id="pbody" placeholder="التفاصيل"></textarea>
<button type="button" class="attachbtn" onclick="openSheet()">📎</button>
</div>
<input id="file" type="file" style="display:none">
<div class="filechip" id="filechip"><span id="filename"></span><button type="button" onclick="clearFile()">✕</button></div>
<button id="pubbtn" onclick="publish()">نشر للطلاب</button>
</div>
<div class="sectT">طلبات الطلاب</div>
<div id="qlist"></div>
<div class="sectT">المنشورات</div>
<div id="plist"></div>
</div>
<div class="sheetbg" id="sheetbg" onclick="closeSheet()">
<div class="sheet" onclick="event.stopPropagation()">
<div class="sheetopt" onclick="pickFile('image/*')"><span class="ic">📷</span>صور</div>
<div class="sheetopt" onclick="pickFile('video/*')"><span class="ic">🎥</span>فيديوهات</div>
<div class="sheetopt" onclick="pickFile('audio/*')"><span class="ic">🎵</span>صوت</div>
<div class="sheetopt" onclick="addLink()"><span class="ic">🔗</span>لينك / موقع</div>
</div>
</div>
<div id="done" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:center;justify-content:center">
<div style="background:#241f33;border:1px solid rgba(230,178,39,.5);border-radius:20px;padding:26px 40px;text-align:center">
<div style="width:64px;height:64px;border-radius:50%;background:#25d366;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff">✓</div>
<div style="font-size:18px;font-weight:700;color:#fff">تم الارسال</div>
</div>
</div>
<p id="msg" class="err"></p>
</div>
<p class="foot">عامل الصفحة: محمد أحمد عبد العزيز</p>
<script>
const supa = supabase.createClient("https://dekyeekdugyzzgdunsjc.supabase.co", "sb_publishable_y41eQ-FcTonQTWDyBVbWSQ_vtgNbf1j");
function el(t, c){ const e = document.createElement(t); if (c !== undefined) e.textContent = c; return e; }
function fmt(ts){ return new Date(ts).toLocaleString("ar-EG", { dateStyle: "medium", timeStyle: "short" }); }
function delBtn(q, fn){ const d = el("button", "مسح"); d.className = "del"; d.onclick = async (ev) => { ev.stopPropagation(); if (confirm(q)) { await fn(); } }; return d; }
async function login(){
 msg.textContent = "";
 const { error } = await supa.auth.signInWithPassword({ email: email.value, password: pass.value });
 if (error) { msg.textContent = "الإيميل أو كلمة السر غلط"; return; }
 show();
}
function show(){
 form.style.display = "none";
 panel.style.display = "block";
 logoutbtn.style.display = "inline-block";
 load();
 qload();
}
const KNAMES = { news: "خبر", alert: "تنبيه", homework: "واجب", gazette: "جريدة", info: "معلومات" };
function openSheet(){ sheetbg.style.display = "block"; }
function closeSheet(){ sheetbg.style.display = "none"; }
function pickFile(acc){
 file.accept = acc;
 file.onchange = () => {
  if (file.files[0]) { filename.textContent = file.files[0].name; filechip.style.display = "flex"; }
 };
 closeSheet();
 file.click();
}
function clearFile(){ file.value = ""; filechip.style.display = "none"; }
function addLink(){
 closeSheet();
 const u = prompt("اكتب أو الصق اللينك:");
 if (u && u.trim()) { pbody.value = (pbody.value ? pbody.value + "\n" : "") + u.trim(); }
}
function arabErr(m){
 if (!m) return "خطأ غير معروف";
 const l = m.toLowerCase();
 if (l.includes("exceeded") || l.includes("maximum allowed") || l.includes("too large") || l.includes("payload")) return "الملف أكبر من المسموح (50 ميجا في الخطة المجانية). صغّر الفيديو أو ابعته كلينك من 📎";
 if (l.includes("mime") || l.includes("not supported")) return "نوع الملف ده مش مدعوم";
 if (l.includes("security policy") || l.includes("unauthorized") || l.includes("jwt")) return "جلسة الدخول خلصت. اخرج وسجل دخول تاني";
 if (l.includes("fetch") || l.includes("network") || l.includes("timeout")) return "النت قطع أثناء الرفع. حاول تاني على نت أحسن";
 return m;
}
function showDone(){
 done.style.display = "flex";
 setTimeout(() => { done.style.display = "none"; }, 2200);
}
let publishing = false;
async function publish(){
 if (publishing) return;
 msg.className = "err";
 msg.textContent = "";
 if (!ptitle.value.trim() || !pbody.value.trim()) { msg.textContent = "اكتب العنوان والتفاصيل"; return; }
 const f = file.files[0];
 if (f && f.size > 45000000) { msg.textContent = "الملف أكبر من 45 ميجا. صغّره أو ابعته كلينك من زرار 📎"; return; }
 publishing = true;
 pubbtn.disabled = true;
 try {
  let url = null;
  if (f) {
   let ext = "";
   const dot = f.name.lastIndexOf(".");
   if (dot > -1) ext = f.name.slice(dot + 1).toLowerCase();
   else if (f.type && f.type.includes("/")) ext = f.type.split("/")[1];
   if (!ext) ext = "bin";
   const path = Date.now() + "." + ext;
   let e2 = null;
   for (let i = 0; i < 5; i++) {
    msg.textContent = i === 0 ? "جاري رفع الملف... استنى لحد ما يخلص" : "النت تقيلة، بحاول تاني (" + (i + 1) + " من 5)...";
    const r = await supa.storage.from("media").upload(path, f, { upsert: true });
    if (!r.error) { e2 = null; break; }
    e2 = r.error;
    await new Promise(rr => setTimeout(rr, 1500));
   }
   if (e2) { msg.textContent = "الملف مترفعش: " + arabErr(e2.message); return; }
   url = supa.storage.from("media").getPublicUrl(path).data.publicUrl;
  }
  msg.textContent = "جاري النشر...";
  const { error } = await supa.from("posts").insert({ title: ptitle.value.trim(), body: pbody.value.trim(), kind: kind.value, media_url: url });
  if (error) { msg.textContent = "حصل خطأ: " + error.message; return; }
  ptitle.value = ""; pbody.value = ""; clearFile();
  msg.textContent = "";
  showDone();
  load();
 } finally {
  publishing = false;
  pubbtn.disabled = false;
 }
}
async function load(){
 const { data } = await supa.from("posts").select("*").order("created_at", { ascending: false });
 plist.innerHTML = "";
 (data || []).forEach(p => {
  const d = el("div");
  d.className = "prow";
  const tag = el("span", KNAMES[p.kind] || "خبر");
  tag.className = "tag";
  d.append(tag, el("b", p.title), delBtn("تمسح؟", async () => { if (p.media_url) await supa.storage.from("media").remove([p.media_url.split("/media/")[1]]); await supa.from("posts").delete().eq("id", p.id); load(); }));
  plist.appendChild(d);
 });
}
async function qload(){
 const { data, error } = await supa.from("questions").select("*").order("created_at", { ascending: false });
 qlist.innerHTML = "";
 if (error) { qlist.appendChild(el("p", "الطلبات ماتحملتش، اعمل تحديث للصفحة")); return; }
 if (!data || !data.length) { const e2 = el("p", "لسه مفيش طلبات من الطلاب"); e2.className = "emptys"; qlist.appendChild(e2); return; }
 data.forEach(q => {
  const row = el("div");
  row.className = "qrow";
  const av = el("div", q.name.trim().charAt(0));
  av.className = "av";
  const qm = el("div");
  qm.className = "qm";
  const qn = el("div", q.name);
  qn.className = "qn";
  const qp = el("div", q.question);
  qp.className = "qp";
  qm.append(qn, qp);
  const qt = el("span", fmt(q.created_at));
  qt.className = "qt";
  const st = q.reply ? (() => { const s = el("span", "✓✓"); s.className = "done"; return s; })() : (() => { const s = el("span"); s.className = "dot"; return s; })();
  row.append(av, qm, qt, st);
  const th = el("div");
  th.className = "thread";
  const qb = el("div");
  qb.className = "tbub tin";
  qb.append(el("p", q.question), el("small", fmt(q.created_at)));
  th.appendChild(qb);
  if (q.reply) {
   const rb = el("div");
   rb.className = "tbub tout";
   const rp = el("p");
   rp.append(el("b", "ردك: "), q.reply);
   rb.append(rp);
   th.appendChild(rb);
  } else {
   const inp = el("textarea");
   inp.placeholder = "اكتب ردك هنا";
   const btn = el("button", "إرسال الرد");
   btn.className = "rep";
   const st2 = el("p");
   st2.style.minHeight = "16px";
   st2.style.fontSize = "13px";
   btn.onclick = async () => {
    if (!inp.value.trim()) return;
    btn.disabled = true;
    st2.textContent = "جاري الإرسال...";
    const { error: e3 } = await supa.from("questions").update({ reply: inp.value.trim() }).eq("id", q.id);
    btn.disabled = false;
    if (e3) { st2.textContent = "الرد ماتبعتش: " + e3.message; return; }
    qload();
   };
   th.append(inp, btn, st2);
  }
  th.append(delBtn("تمسح السؤال ده؟", async () => { await supa.from("questions").delete().eq("id", q.id); qload(); }));
  row.onclick = () => th.classList.toggle("open");
  qlist.append(row, th);
 });
}
async function logout(){
 await supa.auth.signOut();
 panel.style.display = "none";
 logoutbtn.style.display = "none";
 form.style.display = "block";
}
supa.auth.getSession().then(({ data }) => { if (data.session) show(); });
</script>
</body>
</html>
