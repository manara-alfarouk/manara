<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منطقة القائد</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#4d446b;font-family:sans-serif;padding:14px}
.card{background:#fff;border-radius:14px;padding:18px;max-width:420px;margin:0 auto;text-align:center}
img{width:80px;height:80px;border-radius:50%}
h1{font-size:19px;color:#4d446b;margin:6px 0 2px}
input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:4px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{width:100%;padding:11px;border:0;border-radius:8px;background:#e6b227;font-size:16px}
#msg{min-height:18px;font-size:14px;margin-top:6px}
.err{color:#c00000}.ok{color:#1a7f4b}
#panel{display:none;text-align:right}
.post{border:1px solid #eee;padding:8px;margin:6px 0}
.del{width:auto;padding:3px 10px;background:#c00000;color:#fff}
</style>
</head>
<body>
<div class="card">
<img src="IMG-20261127-WA0036.jpg">
<h1>منطقة القائد</h1>
<div id="form">
<input id="email" type="email" placeholder="الإيميل">
<input id="pass" type="password" placeholder="كلمة السر">
<button onclick="login()">دخول</button>
</div>
<div id="panel">
<input id="ptitle" placeholder="العنوان">
<select id="kind">
<option value="news">خبر</option>
<option value="alert">تنبيه مهم</option>
</select>
<textarea id="pbody" placeholder="التفاصيل"></textarea>
<input id="file" type="file" accept="image/*,video/*,audio/*">
<button onclick="publish()">نشر للطلاب</button>
<h2>طلبات الطلاب</h2>
<div id="qlist"></div>
<h2>المنشورات</h2>
<div id="plist"></div>
<button onclick="logout()" style="background:#4d446b;color:#fff">خروج</button>
</div>
<p id="msg" class="err"></p>
</div>
<p style="text-align:center;color:#e6b227">عامل الصفحة: محمد أحمد عبد العزيز</p>
<script>
const supa = supabase.createClient("https://dekyeekdugyzzgdunsjc.supabase.co", "sb_publishable_y41eQ-FcTonQTWDyBVbWSQ_vtgNbf1j");
function el(t, c){ const e = document.createElement(t); if (c !== undefined) e.textContent = c; return e; }
function delBtn(q, fn){ const d = el("button", "مسح"); d.className = "del"; d.onclick = async () => { if (confirm(q)) { await fn(); } }; return d; }
async function login(){
 msg.textContent = "";
 const { error } = await supa.auth.signInWithPassword({ email: email.value, password: pass.value });
 if (error) { msg.textContent = "الإيميل أو كلمة السر غلط"; return; }
 show();
}
function show(){
 form.style.display = "none";
 panel.style.display = "block";
 load();
 qload();
}
async function publish(){
 msg.className = "err";
 msg.textContent = "";
 if (!ptitle.value.trim() || !pbody.value.trim()) { msg.textContent = "اكتب العنوان والتفاصيل"; return; }
 let url = null;
 const f = file.files[0];
 if (f) {
  const path = Date.now() + "." + f.name.split(".").pop().toLowerCase();
  const { error: e2 } = await supa.storage.from("media").upload(path, f);
  if (e2) { msg.textContent = "الملف مترفعش: " + e2.message; return; }
  url = supa.storage.from("media").getPublicUrl(path).data.publicUrl;
 }
 const { error } = await supa.from("posts").insert({ title: ptitle.value.trim(), body: pbody.value.trim(), kind: kind.value, media_url: url });
 if (error) { msg.textContent = "حصل خطأ: " + error.message; return; }
 ptitle.value = ""; pbody.value = "";
 msg.className = "ok";
 msg.textContent = "اتنشر!";
 load();
}
async function load(){
 const { data } = await supa.from("posts").select("*").order("created_at", { ascending: false });
 plist.innerHTML = "";
 (data || []).forEach(p => {
  const d = el("div");
  d.className = "post";
  d.append(el("b", p.title), delBtn("تمسح؟", async () => { if (p.media_url) await supa.storage.from("media").remove([p.media_url.split("/media/")[1]]); await supa.from("posts").delete().eq("id", p.id); load(); }));
  plist.appendChild(d);
 });
}
async function qload(){
 const { data } = await supa.from("questions").select("*").order("created_at", { ascending: false });
 qlist.innerHTML = "";(data || []).forEach(q => {
  const d = el("div");
  d.className = "post";
  d.append(el("b", q.name), el("p", q.question));
  if (q.reply) {
   d.append(el("p", "ردك: " + q.reply));
  } else {
   const inp = el("textarea");
   inp.placeholder = "اكتب ردك";
   const btn = el("button", "إرسال الرد");
   btn.onclick = async () => { if (inp.value.trim()) { await supa.from("questions").update({ reply: inp.value.trim() }).eq("id", q.id); qload(); } };
   d.append(inp, btn);
  }
  d.append(delBtn("تمسح؟", async () => { await supa.from("questions").delete().eq("id", q.id); qload(); }));
  qlist.appendChild(d);
 });
}
async function logout(){
 await supa.auth.signOut();
 panel.style.display = "none";
 form.style.display = "block";
}
supa.auth.getSession().then(({ data }) => { if (data.session) show(); });
</script>
</body>
</html>
